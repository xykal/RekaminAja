name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages (API 37)
        shell: bash
        run: |
          set -x
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1" \
            || "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1" \
            || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/ndk" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --console=plain

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: RekaminAja-apk
          path: |
            app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      # AGP cannot bundle while shrunk resources for multiple ABI-split APK
      # outputs exist. Upload first, then validate the AAB in a clean
      # app-only invocation with APK splits disabled.
      - name: Build Full AAB
        run: ./gradlew :app:clean :app:bundleFullRelease -Prekamin.abiSplits=false --stacktrace
