name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages (API 37)
        shell: bash
        run: |
          set -x
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools" \
            || "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" \
            || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --console=plain

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: RekaminAja-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
