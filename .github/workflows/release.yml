name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages (API 37)
        shell: bash
        run: |
          set -x
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools" \
            || "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # Signing produksi dari GitHub Secrets (lihat docs/BUILD_RELEASE.md).
      # Kalau secret belum dipasang, build tetap jalan memakai debug key (fallback di build.gradle.kts).
      - name: Prepare signing (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rekaminaja.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/rekaminaja.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Production signing enabled."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set — release will be signed with the DEBUG key. Set up a production keystore before public distribution (docs/BUILD_RELEASE.md)."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build universal release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --console=plain

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          set -e
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" "dist/RekaminAja-${TAG}-universal.apk"
          cp "$AAB" "dist/RekaminAja-${TAG}.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Verify APK signature, badging, and universal contents
        shell: bash
        run: |
          set -e
          APK=$(ls dist/*-universal.apk)
          echo "== $APK =="
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" | head -30
          if unzip -l "$APK" | grep -Eq ' lib/[^ ]*\.so$|ggml-[^ ]*\.bin$'; then
            echo "Universal APK must be pure Kotlin: no bundled native libraries or speech models" >&2
            exit 1
          fi

      # Catatan rilis diambil dari CHANGELOG agar bersih dan konsisten (tanpa emoji).
      - name: Prepare release notes from CHANGELOG
        shell: bash
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { flag=1; print; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'EOF'

          ## Download guide

          - `RekaminAja-...-universal.apk` is the single small APK for Android 7.0 and newer on ARM, ARM64, and x86 devices.
          - The `.aab` file is for app stores and does not need to be installed manually.
          EOF
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
